server:
  port: ${PORT:8015}

spring:
  application:
    name: wallet
  config:
    # F-16: Docker secrets — SECRETS_DIR (default /run/secrets/izgo) dagi har bir fayl shu nomli property
    # (DB_PASSWORD, INTERNAL_TOKENS, REDIS_URL, NATS_URL ...). Muhit o'zgaruvchisi ustun; papka yo'q bo'lsa o'tkaziladi.
    import: "optional:configtree:${SECRETS_DIR:/run/secrets/izgo}/"
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # F-09: so'rov tanasidagi noma'lum maydon — 422 VALIDATION_ERROR {"<maydon>": "unknown_field"} (Go/NestJS bilan bir xil)
      fail-on-unknown-properties: true
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet_db}
    username: ${DB_USER:wallet_svc}
    password: ${DB_PASSWORD:}
  flyway:
    # Flyway JDBC ishlatadi, shuning uchun alohida URL (R2DBC bilan bir baza)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet_db}
    user: ${DB_USER:wallet_svc}
    password: ${DB_PASSWORD:}
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

wallet:
  # Komissiya, bazis punktlarda (1000 = 10%). Keyinroq daraja bo'yicha o'zgaradi.
  commission-bps: ${COMMISSION_BPS:1000}
  # Qarz chegarasi, tiyinda (manfiy): -50 000 so'm = -5 000 000 tiyin
  debt-limit: ${WALLET_DEBT_LIMIT:-5000000}
  # Chegaraning shu ulushiga yetganda "approaching" (0.8 => -4 000 000 tiyin)
  approaching-ratio: ${WALLET_APPROACHING_RATIO:0.8}
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/run/secrets/jwt/public.pem}
    issuer: ${JWT_ISSUER:izgo-identity}
  # Servislararo umumiy sirlar (vergul bilan ajratilgan, kamida 16 belgi). Kodda saqlanmaydi.
  internal-tokens: ${INTERNAL_TOKENS:}
  nats:
    url: ${NATS_URL:nats://localhost:4222}
    enabled: ${NATS_ENABLED:true}
    # F-01: o'z foydalanuvchisi (NATS_PASSWORD — /run/secrets/izgo dan) va TLS CA
    user: ${NATS_USER:}
    password: ${NATS_PASSWORD:}
    ca-file: ${NATS_CA_FILE:}
  payments:
    # mock | real. Hozir faqat mock ishlaydi; real provayder kodi payment/providers/*.kt da kommentda.
    mode: ${PAYMENT_MODE:mock}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8000}
    session-ttl-minutes: ${PAYMENT_SESSION_TTL_MINUTES:30}
    # Callback IP ro'yxati (real rejimda; CIDR yoki IP, vergul bilan)
    callback-allowed-ips: ${PAYMENT_CALLBACK_ALLOWED_IPS:}
