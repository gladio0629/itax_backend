name: izgo

# Ishga tushirishdan oldin: cp .env.example .env  (va qiymatlarni to'ldiring)
# Barcha servislar bitta ichki "izgo" tarmog'ida. Ilova servislariga tashqaridan
# faqat Kong (8000) orqali kiriladi. Kong Admin API (8001) faqat Kong konteyneri ichida;
# infra (5432, 6379, 4222) faqat host'ning 127.0.0.1 iga bog'langan — LAN'dan ochilmaydi. Pricing, Risk, Doc-scanner Kong'da ham yo'q —
# ularni faqat ichki servislar chaqiradi. Notification'dan Kong'da faqat
# /api/v1/notifications va /ws ochiq; matching-geo'dan faqat POST /api/v1/location/update.
# /internal/* yo'llari Kong'da yo'q.

x-service-env: &service-env
  # F-25: REDIS_URL (redis://<servis>:<parol>@redis:6379/0) — Docker secret (scripts/gen-redis-acl.sh), env'da yo'q
  # F-01: NATS faqat TLS + har servisning o'z foydalanuvchisi (NATS_USER servis blokida, NATS_PASSWORD — Docker secret).
  # .env dagi NATS_URL bu yerda ishlatilmaydi: shifrlanmagan ulanishga qaytib bo'lmasin.
  NATS_URL: tls://nats:4222
  NATS_CA_FILE: /run/secrets/mtls/ca.crt

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [izgo]

services:
  # ---------------------------------------------------------------- infra
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env da berilishi kerak}
      # F-16/F-25: superuser paroli va har servis DB paroli fayllardan (scripts/gen-secrets.sh). Servislar superuser
      # parolini bilmaydi; har biri faqat o'z bazasiga ulana oladi (init-databases.sh / sync-passwords.sh).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres/POSTGRES_PASSWORD
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - ./infra/postgres/sync-passwords.sh:/usr/local/bin/izgo-sync-passwords.sh:ro
      - ./secrets/postgres:/run/secrets/postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [izgo]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # F-25: ACL — har servis o'z foydalanuvchisi/paroli, faqat o'z kalitlari (infra/redis/acl.json); default faqat PING
    command: ["redis-server", "--appendonly", "yes", "--aclfile", "/etc/redis/users.acl"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./secrets/redis/users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [izgo]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf", "-js"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - ./secrets/nats/auth.conf:/etc/nats/auth.conf:ro   # F-01: foydalanuvchilar/ruxsatlar (scripts/gen-nats-auth.sh)
      - ./secrets/mtls/nats:/etc/nats/tls:ro               # F-01: server TLS sertifikati
      - nats_data:/data
    healthcheck:
      # monitoring porti (nats.conf: http_port 8222); JetStream ham tayyor bo'lishi kerak
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [izgo]

  kong:
    image: kong:3.7
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # Admin API faqat konteyner ichida (127.0.0.1): na LAN, na izgo tarmog'idagi boshqa konteynerlar (DB-less'da
      # POST /config butun gateway'ni almashtiradi). Kerak bo'lsa (image'da curl yo'q):
      #   docker compose exec kong resty -e 'ngx.say(require("resty.http").new():request_uri("http://127.0.0.1:8001/status").body)'
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      # F-03: mijoz IP si — faqat Caddy (qat'iy IP, pastda) yuborgan X-Forwarded-For ga ishoniladi. 8000 ga to'g'ridan-to'g'ri
      # kelgan so'rov sarlavhani soxtalashtirib IP limitini aylanib o'ta olmaydi.
      KONG_TRUSTED_IPS: 172.20.255.254
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      # Servis qayta yaratilsa (yangi IP) Kong eski IP ni uzoq keshlamasin (aks holda 502)
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_STALE_TTL: "0"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - identity
      - driver
      - trip-order
      - matching-geo
      - wallet
      - backoffice
      - notification
    networks: [izgo]

  # ------------------------- public servislar (faqat Kong orqali, host port yo'q)
  identity:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      <<: *service-env
      NATS_USER: identity   # F-01: infra/nats/permissions.json
      PORT: "8010"
      DB_HOST: postgres
      DB_USER: identity_svc
      DB_NAME: identity_db
      # DB_PASSWORD: Docker secret — secrets/svc/identity/DB_PASSWORD -> /run/secrets/izgo/DB_PASSWORD (scripts/gen-secrets.sh)
      # Ed25519 kalitlari: ./scripts/gen-jwt-keys.sh  ->  secrets/jwt/{private,public}.pem
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      # Barcha servislarda bir xil bo'lishi shart (tekshiruvchilar `iss` ni solishtiradi)
      JWT_ISSUER: ${JWT_ISSUER:-izgo-identity}
      # Ixtiyoriy: birinchi superadmin (faqat email + telefon; kirish baribir OTP orqali)
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PHONE: ${ADMIN_BOOTSTRAP_PHONE:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Superadmin}
      # Ichki API (/internal/identity/*) uchun X-Internal-Token; bo'sh bo'lsa servis ishga tushmaydi
      # INTERNAL_TOKENS: Docker secret — secrets/svc/identity/INTERNAL_TOKENS -> /run/secrets/izgo/INTERNAL_TOKENS (scripts/gen-secrets.sh)
      # OTP SMS (smsxabarnoma.uz): SMS_MODE=real va kalit bo'lsa yuboriladi, aks holda logga (mock)
      SMS_MODE: ${SMS_MODE:-mock}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-https://smsxabarnoma.uz/api/v1}
      # SMS_PROVIDER_KEY: Docker secret — secrets/svc/identity/SMS_PROVIDER_KEY -> /run/secrets/izgo/SMS_PROVIDER_KEY (scripts/gen-secrets.sh)
      # Admin email kodi (Resend): EMAIL_MODE=real va kalit bo'lsa yuboriladi, aks holda logga (mock)
      EMAIL_MODE: ${EMAIL_MODE:-mock}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      # EMAIL_API_KEY: Docker secret — secrets/svc/identity/EMAIL_API_KEY -> /run/secrets/izgo/EMAIL_API_KEY (scripts/gen-secrets.sh)
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      # Muhit nomi: production/prod bo'lsa DEV_MODE bilan servis ishga tushmaydi
      APP_ENV: ${APP_ENV:-development}
      # FAQAT lokal ishlab chiqish: ro'yxatdagi test telefon/email'lar uchun doimiy OTP (docs/dev-testing.md).
      # DEV_MODE=true + APP_ENV=production yoki SMS_MODE/EMAIL_MODE=real bo'lsa identity ishga tushmaydi.
      DEV_MODE: ${DEV_MODE:-false}
      DEV_OTP_CODE: ${DEV_OTP_CODE:-}
      DEV_TEST_PHONES: ${DEV_TEST_PHONES:-}
      DEV_TEST_EMAILS: ${DEV_TEST_EMAILS:-}
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
      - ./secrets/svc/identity:/run/secrets/izgo:ro   # F-16: sirlar (fayl nomi = env nomi)
      - ./secrets/mtls/identity:/run/secrets/mtls:ro   # F-02: sertifikat (bosqich 2 da ishlatiladi)
    expose: ["8010"]
    healthcheck:
      test: ["CMD", "/identity", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }

  driver:
    <<: *service-defaults
    build: ./services/driver
    environment:
      <<: *service-env
      NATS_USER: driver   # F-01: infra/nats/permissions.json
      PORT: "8011"
      DB_HOST: postgres
      DB_USER: driver_svc
      DB_NAME: driver_db
      # DB_PASSWORD: Docker secret — secrets/svc/driver/DB_PASSWORD -> /run/secrets/izgo/DB_PASSWORD (scripts/gen-secrets.sh)
      # Identity public.pem (JWT tekshirish uchun faqat public kalit): ./scripts/gen-jwt-keys.sh
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-izgo-identity}
      # Imzolangan yuklash URL lari uchun HMAC kaliti (kamida 16 belgi). scripts/gen-secrets.sh yaratadi;
      # bo'sh qolsa faqat driver servisi ishga tushmaydi (config xatosi)
      # UPLOAD_SIGNING_SECRET: Docker secret — secrets/svc/driver/UPLOAD_SIGNING_SECRET -> /run/secrets/izgo/UPLOAD_SIGNING_SECRET (scripts/gen-secrets.sh)
      # Mijoz ko'radigan manzil (upload_url shu bilan boshlanadi) — Kong
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      UPLOADS_DIR: /app/uploads
      # DEMO: submitted dan so'ng avtomatik tasdiq. Real tekshiruv ulanganda AUTO_APPROVE_ENABLED=false
      AUTO_APPROVE_ENABLED: ${AUTO_APPROVE_ENABLED:-true}
      AUTO_APPROVE_DELAY_MS: ${AUTO_APPROVE_DELAY_MS:-5000}
      APPROVAL_SYSTEM_ACTOR_ID: ${APPROVAL_SYSTEM_ACTOR_ID:-00000000-0000-0000-0000-000000000001}
      # /internal/driver/* uchun X-Internal-Token (identity/pricing bilan bir xil); bo'sh bo'lsa ichki API hammaga yopiq.
      # Matching'ga profil yuborishda ham birinchi qiymat X-Internal-Token sifatida ishlatiladi.
      # INTERNAL_TOKENS: Docker secret — secrets/svc/driver/INTERNAL_TOKENS -> /run/secrets/izgo/INTERNAL_TOKENS (scripts/gen-secrets.sh)
      # Profil sinxronlash: active bo'lganda va PUT /api/v1/drivers/me da POST /internal/matching/drivers/{user_id}/profile.
      # Bo'sh bo'lsa sinxronlash o'chiq.
      MATCHING_URL: ${MATCHING_URL:-http://matching-geo:8013}
      INTERNAL_HTTP_TIMEOUT_MS: ${INTERNAL_HTTP_TIMEOUT_MS:-3000}
    volumes:
      - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
      - ./secrets/svc/driver:/run/secrets/izgo:ro   # F-16: sirlar (fayl nomi = env nomi)
      - ./secrets/mtls/driver:/run/secrets/mtls:ro   # F-02: sertifikat (bosqich 2 da ishlatiladi)
      - driver_uploads:/app/uploads
    expose: ["8011"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8011/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }

  trip-order:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/trip-order/Dockerfile
    environment:
      <<: *service-env
      NATS_USER: trip-order   # F-01: infra/nats/permissions.json
      PORT: "8012"
      DB_HOST: postgres
      DB_USER: trip_order_svc
      DB_NAME: trip_order_db
      # DB_PASSWORD: Docker secret — secrets/svc/trip-order/DB_PASSWORD -> /run/secrets/izgo/DB_PASSWORD (scripts/gen-secrets.sh)
      # Identity chiqargan tokenlarni tekshirish uchun faqat public kalit (private kalit kerak emas)
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-izgo-identity}
      # Ichki servislar (mock'lar haqiqiy HTTP chaqiruvga almashtirilganda ishlatiladi; faqat Docker tarmog'i ichida)
      PRICING_URL: ${PRICING_URL:-http://pricing:8014}
      MATCHING_URL: ${MATCHING_URL:-http://matching-geo:8013}
      WALLET_URL: ${WALLET_URL:-http://wallet:8015}
      # /internal/* chaqiruvlari uchun X-Internal-Token (pricing/matching-geo/wallet bilan bir xil); kiruvchi
      # /internal/orders (backoffice) ham shu ro'yxat bilan tekshiriladi
      # INTERNAL_TOKENS: Docker secret — secrets/svc/trip-order/INTERNAL_TOKENS -> /run/secrets/izgo/INTERNAL_TOKENS (scripts/gen-secrets.sh)
    volumes:
      - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
      - ./secrets/svc/trip-order:/run/secrets/izgo:ro   # F-16: sirlar (fayl nomi = env nomi)
      - ./secrets/mtls/trip-order:/run/secrets/mtls:ro   # F-02: sertifikat (bosqich 2 da ishlatiladi)
    expose: ["8012"]
    healthcheck:
      test: ["CMD", "/trip-order", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }

  matching-geo:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/matching-geo/Dockerfile
    environment:
      <<: *service-env
      NATS_USER: matching-geo   # F-01: infra/nats/permissions.json
      PORT: "8013"
      # Servislararo umumiy sir (pricing bilan bir xil INTERNAL_TOKENS). Bo'sh bo'lsa faqat matching-geo ishga tushmaydi.
      # INTERNAL_TOKENS: Docker secret — secrets/svc/matching-geo/INTERNAL_TOKENS -> /run/secrets/izgo/INTERNAL_TOKENS (scripts/gen-secrets.sh)
      LOCATION_TTL: ${LOCATION_TTL:-2m}
      MAX_SPEED_KMH: ${MAX_SPEED_KMH:-300}
      DEFAULT_RADIUS_M: ${DEFAULT_RADIUS_M:-50000}
      ROAD_FACTOR: ${ROAD_FACTOR:-1.3}
      AVG_SPEED_KMH: ${AVG_SPEED_KMH:-30}
      # Public POST /api/v1/location/update (Kong orqali): haydovchi access tokeni Identity public kaliti bilan tekshiriladi
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-izgo-identity}
    volumes:
      - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
      - ./secrets/svc/matching-geo:/run/secrets/izgo:ro   # F-16: sirlar (fayl nomi = env nomi)
      - ./secrets/mtls/matching-geo:/run/secrets/mtls:ro   # F-02: sertifikat (bosqich 2 da ishlatiladi)
    expose: ["8013"]
    healthcheck:
      test: ["CMD", "/matching-geo", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis: { condition: service_healthy }
      nats: { condition: service_started }

  wallet:
    <<: *service-defaults
    build: ./services/wallet
    environment:
      <<: *service-env
      NATS_USER: wallet   # F-01: infra/nats/permissions.json
      PORT: "8015"
      DB_HOST: postgres
      DB_USER: wallet_svc
      DB_NAME: wallet_db
      # DB_PASSWORD: Docker secret — secrets/svc/wallet/DB_PASSWORD -> /run/secrets/izgo/DB_PASSWORD (scripts/gen-secrets.sh)
      # Identity chiqargan tokenlarni tekshirish uchun faqat public kalit
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-izgo-identity}
      # Servislararo umumiy sir (/internal/wallet/*). scripts/gen-secrets.sh yaratadi.
      # INTERNAL_TOKENS: Docker secret — secrets/svc/wallet/INTERNAL_TOKENS -> /run/secrets/izgo/INTERNAL_TOKENS (scripts/gen-secrets.sh)
      # To'lov provayderlari hozir MOCK
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
      COMMISSION_BPS: ${COMMISSION_BPS:-1000}
    volumes:
      - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
      - ./secrets/svc/wallet:/run/secrets/izgo:ro   # F-16: sirlar (fayl nomi = env nomi)
      - ./secrets/mtls/wallet:/run/secrets/mtls:ro   # F-02: sertifikat (bosqich 2 da ishlatiladi)
    expose: ["8015"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }

  backoffice:
    <<: *service-defaults
    # Build konteksti — repo ildizi: shared/roles/roles.json image ichiga nusxalanadi
    build:
      context: .
      dockerfile: services/backoffice/Dockerfile
    environment:
      <<: *service-env
      NATS_USER: backoffice   # F-01: infra/nats/permissions.json
      PORT: "8017"
      DB_HOST: postgres
      DB_USER: backoffice_svc
      DB_NAME: backoffice_db
      # DB_PASSWORD: Docker secret — secrets/svc/backoffice/DB_PASSWORD -> /run/secrets/izgo/DB_PASSWORD (scripts/gen-secrets.sh)
      # Identity public.pem (admin JWT ni tekshirish uchun faqat public kalit)
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-izgo-identity}
      ROLES_FILE: /app/shared/roles/roles.json
      # Identity bilan xodim sinxronlash (POST /internal/identity/staff). INTERNAL_TOKENS identity bilan bir xil;
      # scripts/gen-secrets.sh yaratadi. Bo'sh bo'lsa faqat backoffice ishga tushmaydi.
      IDENTITY_STAFF_MODE: http
      IDENTITY_INTERNAL_URL: ${IDENTITY_INTERNAL_URL:-http://identity:8010}
      # INTERNAL_TOKENS: Docker secret — secrets/svc/backoffice/INTERNAL_TOKENS -> /run/secrets/izgo/INTERNAL_TOKENS (scripts/gen-secrets.sh)
      # Driver/User lookup (operator navbatida telefon): GET /internal/identity/users/{id} (yo'lovchi) va
      # GET /internal/driver/drivers/{id} (haydovchi). Ikkalasi ham tayyor; test/offline uchun INTERNAL_LOOKUP_MODE=mock
      INTERNAL_LOOKUP_MODE: ${INTERNAL_LOOKUP_MODE:-http}
      DRIVER_INTERNAL_URL: ${DRIVER_INTERNAL_URL:-http://driver:8011}
      # Buyurtmalar va buyurtma statistikasi — Trip & Order ichki API (GET/PATCH /internal/orders, .../cancel, /stats)
      ORDERS_MODE: ${ORDERS_MODE:-http}
      TRIP_ORDER_INTERNAL_URL: ${TRIP_ORDER_INTERNAL_URL:-http://trip-order:8012}
      TZ_OFFSET_HOURS: ${TZ_OFFSET_HOURS:-5}
      # Operator "resolved" qilgan haydovchi arizasi uchun driver.approved chiqariladi
      PUBLISH_APPROVED_ON_RESOLVED: ${PUBLISH_APPROVED_ON_RESOLVED:-true}
    volumes:
      - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
      - ./secrets/svc/backoffice:/run/secrets/izgo:ro   # F-16: sirlar (fayl nomi = env nomi)
      - ./secrets/mtls/backoffice:/run/secrets/mtls:ro   # F-02: sertifikat (bosqich 2 da ishlatiladi)
    expose: ["8017"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8017/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      # admin logout: bekor qilingan sessiyalar (bl:sid:*) Redis'da tekshiriladi
      redis: { condition: service_healthy }
      nats: { condition: service_started }
      identity: { condition: service_healthy }

  # ------------------------------------- ichki servislar (host port YO'Q)
  pricing:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/pricing/Dockerfile
    environment:
      # NATS hozircha ishlatilmaydi (hodisa chiqarmaydi/tinglamaydi), shuning uchun NATS_URL berilmaydi.
      # REDIS_URL — Docker secret (F-25, scripts/gen-redis-acl.sh)
      PORT: "8014"
      DB_HOST: postgres
      DB_USER: pricing_svc
      DB_NAME: pricing_db
      # DB_PASSWORD: Docker secret — secrets/svc/pricing/DB_PASSWORD -> /run/secrets/izgo/DB_PASSWORD (scripts/gen-secrets.sh)
      # Servislararo umumiy sir (vergul bilan bir nechta — almashtirish davrida). scripts/gen-secrets.sh yaratadi.
      # Bo'sh bo'lsa faqat pricing ishga tushmaydi (config tekshiruvi); butun compose to'xtamasligi uchun ":?" ishlatilmaydi.
      # INTERNAL_TOKENS: Docker secret — secrets/svc/pricing/INTERNAL_TOKENS -> /run/secrets/izgo/INTERNAL_TOKENS (scripts/gen-secrets.sh)
      TARIFF_CACHE_TTL: ${TARIFF_CACHE_TTL:-5m}
      ROAD_FACTOR: ${ROAD_FACTOR:-1.3}
      AVG_SPEED_KMH: ${AVG_SPEED_KMH:-30}
    volumes:
      - ./secrets/svc/pricing:/run/secrets/izgo:ro   # F-16: sirlar (fayl nomi = env nomi)
      - ./secrets/mtls/pricing:/run/secrets/mtls:ro   # F-02: sertifikat (bosqich 2 da ishlatiladi)
    expose: ["8014"]
    healthcheck:
      test: ["CMD", "/pricing", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  notification:
    <<: *service-defaults
    build: ./services/notification
    environment:
      <<: *service-env
      NATS_USER: notification   # F-01: infra/nats/permissions.json
      PORT: "8016"
      # Foydalanuvchi tokenlarini (REST va /ws) tekshirish uchun faqat public kalit
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-izgo-identity}
      # Servislararo umumiy sir (pricing/matching-geo bilan bir xil). Bo'sh bo'lsa faqat notification ishga tushmaydi.
      # INTERNAL_TOKENS: Docker secret — secrets/svc/notification/INTERNAL_TOKENS -> /run/secrets/izgo/INTERNAL_TOKENS (scripts/gen-secrets.sh)
      # Mock SMS: OTP kodini logga yozish — FAQAT lokal ishlab chiqish uchun
      MOCK_LOG_SMS_PARAMS: ${MOCK_LOG_SMS_PARAMS:-true}
      # SMS (smsxabarnoma.uz): SMS_MODE=real va kalit bo'lsa yuboriladi, aks holda Mock (log)
      SMS_MODE: ${SMS_MODE:-mock}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-https://smsxabarnoma.uz/api/v1}
      # SMS_PROVIDER_KEY: Docker secret — secrets/svc/notification/SMS_PROVIDER_KEY -> /run/secrets/izgo/SMS_PROVIDER_KEY (scripts/gen-secrets.sh)
      WS_MAX_CONNS: ${WS_MAX_CONNS:-3}
      # WS auth: subprotocol "izgo.v1, bearer.<token>" yoki birinchi xabar. Eski ?token= frontend o'tguncha yoqiq.
      WS_AUTH_TIMEOUT: ${WS_AUTH_TIMEOUT:-5s}
      WS_ALLOW_QUERY_TOKEN: ${WS_ALLOW_QUERY_TOKEN:-true}
      # Brauzer Origin host'lari (vergul bilan, masalan izgo-client.vercel.app,localhost:*); bo'sh = faqat Origin=Host
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
    volumes:
      - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
      - ./secrets/svc/notification:/run/secrets/izgo:ro   # F-16: sirlar (fayl nomi = env nomi)
      - ./secrets/mtls/notification:/run/secrets/mtls:ro   # F-02: sertifikat (bosqich 2 da ishlatiladi)
    expose: ["8016"]
    healthcheck:
      test: ["CMD", "/notification", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis: { condition: service_healthy }
      nats: { condition: service_started }

  risk:
    <<: *service-defaults
    build: ./services/risk
    environment:
      <<: *service-env
      PORT: "8018"
    expose: ["8018"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8018/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: [redis, nats]

  doc-scanner:
    <<: *service-defaults
    build: ./services/doc-scanner
    environment:
      <<: *service-env
      PORT: "8019"
    expose: ["8019"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8019/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: [nats]

  # HTTPS/WSS old qismi (ixtiyoriy, profil "tls"): Caddy Let's Encrypt sertifikatini o'zi oladi va Kong'ga uzatadi.
  #   API_DOMAIN=api.example.uz docker compose --profile tls up -d
  # DNS: API_DOMAIN -> shu server; 80 va 443 portlari ochiq bo'lishi kerak. docs/hosting.md
  caddy:
    image: caddy:2.8.4-alpine
    profiles: [tls]
    restart: unless-stopped
    networks:
      izgo:
        # Kong faqat shu manzildan kelgan X-Forwarded-For ga ishonadi (KONG_TRUSTED_IPS)
        ipv4_address: 172.20.255.254
    environment:
      # bo'sh bo'lsa Caddy ishga tushmaydi (faqat --profile tls bilan kerak)
      API_DOMAIN: ${API_DOMAIN:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      kong: { condition: service_healthy }

networks:
  izgo:
    name: izgo
    ipam:
      config:
        # Dinamik manzillar faqat pastki yarmidan (ip_range); 172.20.255.254 — Caddy uchun band
        - subnet: 172.20.0.0/16
          ip_range: 172.20.0.0/17

volumes:
  pg_data:
  redis_data:
  nats_data:
  driver_uploads:
  caddy_data:
  caddy_config:
