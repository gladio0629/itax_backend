# IZGO API Gateway — Kong DB-less deklarativ konfiguratsiya.
# strip_path: false — servislar to'liq yo'lni oladi (OpenAPI dagi path bilan bir xil).
# /internal/* yo'llari bu yerda ATAYLAB yo'q: ular faqat Docker tarmog'i ichida (X-Internal-Token bilan).
# Pricing (8014), Risk (8018), Doc-scanner (8019) tashqariga umuman chiqmaydi. Matching-geo'dan faqat
# POST /api/v1/location/update (haydovchi GPS, JWT), Notification'dan faqat /api/v1/notifications va /ws ochiq.
# Kong prefiks yo'llarda eng uzun mosini tanlaydi: /admin/v1/auth → identity,
# qolgan /admin/v1/* → backoffice.
_format_version: "3.0"
_transform: true

services:
  # Har servis: ulanish 5 s, o'qish/yozish 30 s (F-20). Route darajasidagi plaginlar global plaginlardan ustun.
  # ------------------------------------------------------------- public API
  - name: identity
    url: http://identity:8010
    connect_timeout: 5000
    read_timeout: 30000   # F-20: 30 s
    write_timeout: 30000
    routes:
      - name: auth
        paths: ["/api/v1/auth"]
        strip_path: false
      # F-03: OTP so'rovi — IP boshiga 5/daqiqa, 30/soat. Telefon boshiga 5/soat (+1 soat blok) — identity'ning o'zida
      # (Kong OSS so'rov tanasidagi telefon bo'yicha cheklay olmaydi).
      - name: otp-request
        paths: ["/api/v1/auth/otp/request"]
        strip_path: false
        plugins:
        - name: rate-limiting
          config:
            minute: 5
            hour: 30
            limit_by: ip
            policy: local
      - name: otp-verify
        paths: ["/api/v1/auth/otp/verify"]
        strip_path: false
        plugins:
        - name: rate-limiting
          config:
            minute: 10
            hour: 100
            limit_by: ip
            policy: local
      - name: profile
        paths: ["/api/v1/profile"]
        strip_path: false
      # F-08: admin kirishi — alohida, qattiqroq limit
      - name: admin-auth
        paths: ["/admin/v1/auth"]
        strip_path: false
        plugins:
        # F-08: /admin/v1/auth/* (identity) ham backoffice'dagi /admin/v1/* bilan bir xil xavfsizlik sarlavhalarini oladi
        # (services/backoffice/src/common/security-headers.ts). Javoblar keshlanmaydi.
        - name: response-transformer
          config:
            add:
              headers:
                - "Content-Security-Policy:default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
                - "X-Frame-Options:DENY"
                - "X-Content-Type-Options:nosniff"
                - "Strict-Transport-Security:max-age=31536000; includeSubDomains"
                - "Cache-Control:no-store"
        - name: rate-limiting
          config:
            minute: 10
            hour: 60
            limit_by: ip
            policy: local

  - name: trip-order
    url: http://trip-order:8012
    connect_timeout: 5000
    read_timeout: 30000   # F-20: 30 s
    write_timeout: 30000
    routes:
      - name: orders
        paths: ["/api/v1/orders"]
        strip_path: false
      - name: trips
        paths: ["/api/v1/trips"]
        strip_path: false
      # ma'lumotnomalar va manzil qidiruvi (Trip & Order ichida; geocoder kaliti faqat serverda)
      - name: cities
        paths: ["/api/v1/cities"]
        strip_path: false
      - name: places
        paths: ["/api/v1/places"]
        strip_path: false
      - name: popular-routes
        paths: ["/api/v1/routes"]
        strip_path: false
      - name: delivery
        paths: ["/api/v1/delivery"]
        strip_path: false

  - name: notification
    url: http://notification:8016
    connect_timeout: 5000
    read_timeout: 30000   # F-20: 30 s
    write_timeout: 30000
    routes:
      - name: notifications
        paths: ["/api/v1/notifications"]
        strip_path: false

  # WebSocket alohida servis: uzoq yashaydigan ulanish (server 25 s da ping yuboradi), 30 s timeout uni uzmasin.
  # Token servisning o'zida tekshiriladi. /internal/* bu yerda ATAYLAB yo'q.
  - name: notification-ws
    url: http://notification:8016
    connect_timeout: 5000
    read_timeout: 3600000
    write_timeout: 3600000
    routes:
      - name: notifications-ws
        paths: ["/ws"]
        strip_path: false

  - name: driver
    url: http://driver:8011
    connect_timeout: 5000
    read_timeout: 30000   # F-20: 30 s
    write_timeout: 30000
    routes:
      - name: drivers
        paths: ["/api/v1/drivers"]
        strip_path: false
      # F-03: hujjat rasmlari (upload-url + PUT .../content) — 10 MB gacha; qolgan hamma joyda 1 MB
      - name: driver-documents
        paths: ["/api/v1/drivers/documents"]
        strip_path: false
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: 10
              size_unit: megabytes
              require_content_length: false

  - name: matching-geo
    url: http://matching-geo:8013
    connect_timeout: 5000
    read_timeout: 30000   # F-20: 30 s
    write_timeout: 30000
    routes:
      - name: location
        paths: ["/api/v1/location"]
        # OPTIONS — brauzer CORS preflight'i shu route'ga tushishi uchun (javobni cors plagini o'zi beradi)
        methods: [POST, OPTIONS]
        strip_path: false

  - name: wallet
    url: http://wallet:8015
    connect_timeout: 5000
    read_timeout: 30000   # F-20: 30 s
    write_timeout: 30000
    routes:
      - name: wallet
        paths: ["/api/v1/wallet"]
        strip_path: false

  # -------------------------------------------------------------- admin API
  - name: backoffice
    url: http://backoffice:8017
    connect_timeout: 5000
    read_timeout: 30000   # F-20: 30 s
    write_timeout: 30000
    routes:
      - name: admin
        paths: ["/admin/v1"]
        strip_path: false
        plugins:
        - name: rate-limiting
          config:
            minute: 120
            hour: 3000
            limit_by: ip
            policy: local

plugins:
  # CORS — faqat 3 ta frontend domeni (client, driver, admin). Domenlar ma'lum bo'lgach shu ro'yxatni to'ldiring
  # (va xuddi shu host'larni .env dagi WS_ALLOWED_ORIGINS ga — WebSocket'ga CORS qo'llanmaydi, Origin'ni notification
  # o'zi tekshiradi). Wildcard yo'q; frontendlar cookie yubormaydi (credentials: "omit"), shuning uchun credentials=false.
  - name: cors
    config:
      origins:
        - "https://CLIENT_DOMAIN.example"   # TODO: yo'lovchi ilovasi, masalan https://izgo-client.vercel.app
        - "https://DRIVER_DOMAIN.example"   # TODO: haydovchi ilovasi
        - "https://ADMIN_DOMAIN.example"    # TODO: admin panel
        # lokal ishlab chiqish (vite dev / preview)
        - "http://localhost:5173"
        - "http://localhost:5174"
        - "http://localhost:5175"
        - "http://localhost:4173"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-App, Idempotency-Key]
      exposed_headers: [X-Request-ID, Retry-After]
      credentials: false
      max_age: 600
      preflight_continue: false
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  # F-03: umumiy cheklovlar (route'da o'z sozlamasi bo'lmasa). IP — Kong ko'rgan mijoz IP si (Caddy ortida
  # X-Forwarded-For dan, faqat Caddy'ning qat'iy IP sidan kelganda: docker-compose.yml KONG_TRUSTED_IPS).
  - name: rate-limiting
    config:
      minute: 100
      limit_by: ip
      policy: local
  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes
      require_content_length: false
