# IZGO NATS — JetStream, autentifikatsiya va TLS (F-01)
port: 4222
http_port: 8222   # monitoring/healthcheck — host'ga chiqarilmaydi

# Foydalanuvchilar va ruxsatlar: secrets/nats/auth.conf (scripts/gen-nats-auth.sh, infra/nats/permissions.json).
# Har servis faqat o'z hodisalarini chiqara oladi; autentifikatsiyasiz ulanish rad etiladi.
include "auth.conf"

# TLS: server sertifikati secrets/mtls/nats (scripts/gen-mtls-certs.sh, dev CA). Klientlar CA ni NATS_CA_FILE bilan
# tekshiradi. Shifrlanmagan ulanish qabul qilinmaydi (tls bloki bo'lsa server TLS talab qiladi).
tls {
  cert_file: "/etc/nats/tls/tls.crt"
  key_file:  "/etc/nats/tls/tls.key"
  timeout: 2
}

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 2GB
}
