  /ws:
    get:
      tags: [Notifications]
      summary: Real-vaqt bildirishnomalar (WebSocket)
      operationId: notificationsWebSocket
      description: |
        WebSocket ulanish (`ws://localhost:8000/ws?token=<access_token>`, Kong → notification:8016).
        OpenAPI WebSocket'ni to'g'ridan-to'g'ri ifodalay olmaydi, shuning uchun bu yerda HTTP Upgrade so'rovi
        sifatida tavsiflangan. Brauzer/mobil WS API sarlavha qo'ya olmaydi, shuning uchun access token
        `Authorization` sarlavhasida emas, `token` query parametrida yuboriladi. Notification servisi tokenni logga yozmaydi, lekin Kong access log'i
        so'rov qatorini query bilan birga yozadi.

        **Ulanishdan oldin tekshiruv**
        - Token ulanish ochilishidan OLDIN tekshiriladi: yo'q yoki noto'g'ri/muddati o'tgan bo'lsa — `401`, ulanish ochilmaydi.
        - Bitta foydalanuvchiga bir vaqtda `WS_MAX_CONNS` (default 3) tagacha ulanish. Ortig'i —
          `403 FORBIDDEN` (`reason: ws_connection_limit`).

        **Server → klient xabarlari** (text frame, JSON; barcha qiymatlar string). Foydalanuvchi faqat o'z
        xabarlarini oladi:
        ```json
        { "type": "order.accepted", "id": "<uuid>", "status": "accepted", "order_id": "<uuid>" }
        ```
        - `type`: `order.created` | `offer.created` | `order.accepted` | `trip.completed` |
          `wallet.limit_reached` | `driver.approved`
        - `id`: hodisaning asosiy obyekti — `order_id`, `offer_id` (haydovchiga yangi taklif), `trip_id`,
          `wallet_id` yoki `driver_id`.
        - `status` va `order_id` — faqat buyurtma holati o'zgarganda: `order.created` → `searching`,
          `order.accepted` → `accepted`, `trip.completed` → `completed`.

        Batafsil matn uchun `GET /api/v1/notifications` ishlatiladi. Foydalanuvchida ochiq WS ulanishi
        bo'lmasa, xabar push orqali yuboriladi.

        **Klient → server:** ma'lumot yuborilmaydi. Klient ma'lumot frame'i yuborsa, ulanish `1008`
        (policy violation) bilan yopiladi. Server har `WS_PING_INTERVAL` (default 25s) da ping yuboradi.

        **Yopish kodlari**
        - `4401 token_expired`: access token muddati tugadi. Tokenni yangilab (`/api/v1/auth/token/refresh`), qayta ulaning.
        - `4401 session_revoked`: sessiya bekor qilindi (logout). Bu har `WS_REVOKE_CHECK` (default 30s) da tekshiriladi.
        - `1001 server_shutdown`: server to'xtamoqda, qayta ulanish kerak.
        - `1008`: klient ma'lumot yubordi.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Identity chiqargan access token (yo'lovchi yoki haydovchi)
          schema: { type: string }
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, enum: [websocket] }
        - name: Connection
          in: header
          required: true
          schema: { type: string, enum: [Upgrade] }
      responses:
        '101':
          description: Switching Protocols — WebSocket ulanishi ochildi
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN — foydalanuvchi ulanishlar limitiga yetdi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { key: FORBIDDEN, params: { reason: ws_connection_limit } } }
        default: { $ref: '#/components/responses/InternalError' }

