        '409': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/wallet/correction/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      summary: Tuzatish yozuvini tasdiqlash (ikkinchi xodim)
      description: |
        `approval_status: pending_approval` → `approved`. Shundan keyin yozuv daftarga tushadi
        va balansga ta'sir qiladi. Yozuvni yaratgan xodim o'zi tasdiqlay olmaydi (`403 FORBIDDEN`).
        Yozuv `pending_approval` holatida bo'lmasa — `403 FORBIDDEN` (`params.reason: not_pending`).
      operationId: adminWalletCorrectionApprove
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Tasdiqlangan tuzatish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/wallet/correction/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      summary: Tuzatish yozuvini rad etish (ikkinchi xodim)
      description: |
        `approval_status: pending_approval` → `rejected`. Yozuv daftarga tushmaydi, balans o'zgarmaydi.
        Yozuvni yaratgan xodim o'zi rad eta olmaydi (`403 FORBIDDEN`).
        Yozuv `pending_approval` holatida bo'lmasa — `403 FORBIDDEN` (`params.reason: not_pending`).
      operationId: adminWalletCorrectionReject
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalReject' }
      responses:
        '200':
          description: Rad etilgan tuzatish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/tariffs:
    get:
      tags: [Admin]
      summary: Tariflar ro'yxati
      operationId: adminTariffsList
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tariflar sahifasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TariffPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin]
      summary: Tarif yaratish (ikki kishi tasdig'i)
      operationId: adminTariffsCreate
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TariffInput' }
      responses:
        '202':
          description: Tasdiq kutilmoqda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/tariffs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin]
      summary: Bitta tarif
      operationId: adminTariffsGet
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Tarif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TariffNotFound' }
        default: { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin]
      summary: Tarifni o'zgartirish (ikki kishi tasdig'i)
      operationId: adminTariffsUpdate
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TariffInput' }
      responses:
        '202':
          description: O'zgarish tasdiq kutmoqda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TariffNotFound' }
        '409': { $ref: '#/components/responses/TariffChangePending' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin]
      summary: Tarifni o'chirish (ikki kishi tasdig'i)
      operationId: adminTariffsDelete
      security: [{ adminBearer: [] }]
      responses:
        '202':
          description: O'chirish tasdiq kutmoqda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TariffNotFound' }
        '409': { $ref: '#/components/responses/TariffChangePending' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/tariffs/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      summary: Tarif o'zgarishini tasdiqlash (ikkinchi xodim)
      description: |
        `approval_status: pending_approval` → `approved`. `pending_change` (create/update/delete)
        kuchga kiradi va `null` bo'ladi. O'zgarishni so'ragan xodim o'zi tasdiqlay olmaydi
        (`403 FORBIDDEN`). Tasdiq kutayotgan o'zgarish bo'lmasa — `403 FORBIDDEN`
        (`params.reason: not_pending`).
      operationId: adminTariffsApprove
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Tasdiqlangan tarif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TariffNotFound' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/tariffs/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      summary: Tarif o'zgarishini rad etish (ikkinchi xodim)
      description: |
        `approval_status: pending_approval` → `rejected`. `pending_change` bekor qilinadi (`null`),
        tarifning amaldagi qiymatlari o'zgarmaydi. O'zgarishni so'ragan xodim o'zi rad eta olmaydi
        (`403 FORBIDDEN`). Tasdiq kutayotgan o'zgarish bo'lmasa — `403 FORBIDDEN`
        (`params.reason: not_pending`).
      operationId: adminTariffsReject
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalReject' }
      responses:
        '200':
          description: Rad etilgan o'zgarish bilan tarif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TariffNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/operator/queue:
    get:
      tags: [Admin]
      summary: Operator navbati
      operationId: adminOperatorQueue
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Navbat sahifasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/operator/queue/{id}/start:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      summary: Navbatdagi ishni boshlash (operatorga biriktiriladi)
      operationId: adminOperatorStart
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Biriktirilgan ish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/operator/queue/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      summary: Navbatdagi ishni rad etish
      operationId: adminOperatorReject
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueReject' }
      responses:
        '200':
          description: Rad etilgan ish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/operator/queue/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      summary: Navbatdagi ishni yakunlash (natija + izoh)
      description: |
        Faqat `in_progress` holatidagi va shu operatorga biriktirilgan ish yakunlanadi:
        `status: in_progress` → `completed`, `result` va `comment` saqlanadi.
        Aks holda `403 FORBIDDEN` (`params.reason: not_in_progress` yoki `not_assigned`).
      operationId: adminOperatorComplete
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueComplete' }
      responses:
        '200':
          description: Yakunlangan ish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/operator/history:
    get:
      tags: [Admin]
      summary: Operator tarixi
      operationId: adminOperatorHistory
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tarix sahifasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/stats:
    get:
      tags: [Admin]
      summary: Umumiy statistika
      operationId: adminStats
      security: [{ adminBearer: [] }]
      parameters:
        - name: from_date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to_date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Statistika
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }

# ============================================================================
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Yo'lovchi / haydovchi access token (OTP orqali olingan)
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Backoffice xodimi tokeni (email + SMS ikki bosqichli kirish)

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Oldingi javobdagi `cursor` qiymati
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Takroriy so'rovdan himoya (UUID)
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: VALIDATION_ERROR, params: { fields: { phone: invalid_format } } } }
    Unauthorized:
      description: AUTH_TOKEN_EXPIRED yoki token yo'q / noto'g'ri
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: AUTH_TOKEN_EXPIRED, params: {} } }
    RateLimited:
      description: AUTH_OTP_RATE_LIMITED — OTP limiti (telefon 5/soat, IP 20/soat) yoki qayta so'rash vaqti kelmagan
      headers:
        Retry-After:
          description: Necha soniyadan keyin urinish mumkin
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: AUTH_OTP_RATE_LIMITED, params: { retry_after: 42 } } }
    Forbidden:
      description: |
        FORBIDDEN. `params.reason` — sabab (masalan `trip_started`, `driver_assigned`,
        `active_orders_limit`, `already_rated`, `order_not_completed`).
        To'liq ro'yxat — `shared/errors/errors.json` → `codes.FORBIDDEN.reasons`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: FORBIDDEN, params: {} } }
    DriverBlocked:
      description: DRIVER_BLOCKED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: DRIVER_BLOCKED, params: { reason: documents_expired } } }
    NotFound:
      description: NOT_FOUND — umumiy "topilmadi"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: NOT_FOUND, params: { id: 3fa85f64-5717-4562-b3fc-2c963f66afa6 } } }
    DriverNotFound:
      description: DRIVER_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: DRIVER_NOT_FOUND, params: { driver_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6 } } }
    PassengerNotFound:
      description: PASSENGER_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: PASSENGER_NOT_FOUND, params: { passenger_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6 } } }
    StaffNotFound:
      description: STAFF_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: STAFF_NOT_FOUND, params: { staff_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6 } } }
    TariffNotFound:
      description: TARIFF_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: TARIFF_NOT_FOUND, params: { tariff_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6 } } }
    OrderNotFound:
      description: ORDER_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: ORDER_NOT_FOUND, params: { order_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6 } } }
    RegistrationAlreadySubmitted:
      description: REGISTRATION_ALREADY_SUBMITTED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: REGISTRATION_ALREADY_SUBMITTED, params: {} } }
    DocumentAlreadyUploaded:
      description: DOCUMENT_ALREADY_UPLOADED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: DOCUMENT_ALREADY_UPLOADED, params: {} } }
    StaffConflict:
      description: STAFF_EMAIL_TAKEN yoki STAFF_PHONE_TAKEN — email/telefon boshqa xodimda band
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            email: { value: { error: { key: STAFF_EMAIL_TAKEN, params: {} } } }
            phone: { value: { error: { key: STAFF_PHONE_TAKEN, params: {} } } }
    StaffPhoneTaken:
      description: STAFF_PHONE_TAKEN — telefon boshqa xodimda band
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: STAFF_PHONE_TAKEN, params: {} } }
    TariffChangePending:
      description: TARIFF_CHANGE_PENDING — tarifda tasdiq kutayotgan o'zgarish bor; avval approve yoki reject qilinishi kerak
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: TARIFF_CHANGE_PENDING, params: {} } }
    IdempotencyKeyReused:
      description: IDEMPOTENCY_KEY_REUSED — shu Idempotency-Key boshqa so'rov tanasi bilan ishlatilgan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: IDEMPOTENCY_KEY_REUSED, params: {} } }
    FileTooLarge:
      description: FILE_TOO_LARGE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: FILE_TOO_LARGE, params: { max_bytes: 10485760 } } }
    OrderAlreadyTaken:
      description: ORDER_ALREADY_TAKEN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: ORDER_ALREADY_TAKEN, params: { order_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6 } } }
    WalletLimitReached:
      description: WALLET_LIMIT_REACHED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: WALLET_LIMIT_REACHED, params: { limit: -5000000 } } }
    InternalError:
      description: INTERNAL_ERROR
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { key: INTERNAL_ERROR, params: { request_id: 7f1c2e9a } } }

  schemas:
    # ----------------------------------------------------------- umumiy
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [key, params]
          additionalProperties: false
          properties:
            key:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              description: |
                Xato kaliti. Asosiy kodlar katalogi — shared/errors/errors.json
                (ro'yxat kengayishi mumkin, shuning uchun enum emas).
              examples:
                - AUTH_OTP_EXPIRED
                - AUTH_OTP_INVALID
                - AUTH_OTP_RATE_LIMITED
                - AUTH_TOKEN_EXPIRED
                - ORDER_NOT_FOUND
                - ORDER_ALREADY_TAKEN
                - WALLET_LIMIT_REACHED
                - DRIVER_BLOCKED
                - FORBIDDEN
                - VALIDATION_ERROR
                - INTERNAL_ERROR
            params:
              type: object
              additionalProperties: true

    Uuid:
      type: string
      format: uuid
      readOnly: true

    Money:
      type: integer
      description: Summa tiyinda (1 UZS = 100 tiyin)

    Phone:
      type: string
      pattern: '^\+998[0-9]{9}$'
      example: '+998901234567'

    GeoPoint:
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        address: { type: string, maxLength: 300 }

    CursorPage:
      type: object
      required: [data, cursor]
      properties:
        data:
          type: array
        cursor:
          type: [string, 'null']
          description: Keyingi sahifa uchun; `null` — oxirgi sahifa

    # ------------------------------------------------------------- auth
    OtpRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone: { $ref: '#/components/schemas/Phone' }

    OtpRequestResult:
      type: object
      required: [expires_in, resend_after]
      properties:
        expires_in: { type: integer, description: Kodning amal qilish muddati (soniya), readOnly: true }
        resend_after: { type: integer, description: Qayta so'rash mumkin bo'lgan vaqt (soniya), readOnly: true }

    OtpVerify:
      type: object
      required: [phone, code]
      additionalProperties: false
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        code: { type: string, pattern: '^[0-9]{4,6}$' }

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, writeOnly: true }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token: { type: string, readOnly: true }
        refresh_token: { type: string, readOnly: true }
        expires_in: { type: integer, description: Access token muddati (soniya), readOnly: true }
        token_type: { type: string, const: Bearer, readOnly: true }
        is_new_user: { type: boolean, readOnly: true }

    AdminLoginEmail:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }

    AdminLoginChallenge:
      type: object
      required: [challenge_id, expires_in]
      properties:
        challenge_id: { $ref: '#/components/schemas/Uuid' }
        expires_in: { type: integer, readOnly: true }

    AdminLoginSms:
      type: object
      required: [phone]
      additionalProperties: false
      description: "`challenge_id` va `email_code` birga yuboriladi yoki ikkalasi ham yo'q (email'siz operator)."
      properties:
        challenge_id: { type: string, format: uuid }
        email_code: { type: string, pattern: '^[0-9]{6}$' }
        phone: { $ref: '#/components/schemas/Phone' }
      dependentRequired:
        challenge_id: [email_code]
        email_code: [challenge_id]

    AdminLoginVerify:
      type: object
      required: [challenge_id, sms_code]
      additionalProperties: false
      properties:
        challenge_id: { type: string, format: uuid }
        sms_code: { type: string, pattern: '^[0-9]{4,6}$' }

    AdminToken:
      type: object
      required: [access_token, expires_in, token_type]
      properties:
        access_token: { type: string, readOnly: true }
        expires_in: { type: integer, readOnly: true }
        token_type: { type: string, const: Bearer, readOnly: true }

    # ----------------------------------------------------------- driver
    DriverState:
      type: string
      enum: [draft, pending_review, active, rejected, blocked]
      description: |
        draft — ro'yxat tugallanmagan; pending_review — tekshiruvda; active — faol;
        rejected — rad etilgan; blocked — bloklangan.

    Car:
      type: object
      required: [brand, model, year, color, plate_number, car_class, seats]
      additionalProperties: false
      properties:
        brand: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 50 }
        year: { type: integer, minimum: 1990, maximum: 2100 }
        color: { type: string, maxLength: 30 }
        plate_number: { type: string, maxLength: 15, example: 01A123BC }
        car_class: { $ref: '#/components/schemas/CarClass' }
        seats: { type: integer, minimum: 1, maximum: 8 }

    DriverProfile:
      type: object
      required: [id, user_id, phone, first_name, last_name, state, rating]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        phone: { allOf: [{ $ref: '#/components/schemas/Phone' }], readOnly: true }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri, readOnly: true }
        car: { allOf: [{ $ref: '#/components/schemas/Car' }], readOnly: true }
        state: { allOf: [{ $ref: '#/components/schemas/DriverState' }], readOnly: true }
        rating: { type: number, minimum: 0, maximum: 5, readOnly: true }
        trips_count: { type: integer, readOnly: true }

    DriverProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        first_name: { type: string, minLength: 1, maxLength: 50 }
        last_name: { type: string, minLength: 1, maxLength: 50 }
        avatar_document_id: { type: string, format: uuid, description: upload-url orqali yuklangan rasm }

    RegistrationStep1:
      title: Step 1 — shaxsiy ma'lumotlar
      type: object
      required: [first_name, last_name, birth_date, city]
      additionalProperties: false
      properties:
        first_name: { type: string, minLength: 1, maxLength: 50 }
        last_name: { type: string, minLength: 1, maxLength: 50 }
        birth_date: { type: string, format: date }
        city: { type: string, maxLength: 50 }

    RegistrationStep2:
      title: Step 2 — mashina
      type: object
      required: [car]
      additionalProperties: false
      properties:
        car: { $ref: '#/components/schemas/Car' }

    RegistrationStep3:
      title: Step 3 — hujjatlar
      type: object
      required: [documents]
      additionalProperties: false
      description: |
        Majburiy turlar: `license_front`, `selfie`. Har tur va har document_id bir martadan.
        Hujjat shu haydovchiniki, turi mos va holati `uploaded` bo'lishi shart
        (aks holda `VALIDATION_ERROR`: `not_found` / `mismatch` / `not_uploaded`).
        `avatar` bu qadamda qabul qilinmaydi.
      properties:
        documents:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [kind, document_id]
            additionalProperties: false
            properties:
              kind:
                allOf: [{ $ref: '#/components/schemas/DocumentKind' }]
                not: { const: avatar }
              document_id: { type: string, format: uuid }

    RegistrationStep4:
      title: Step 4 — tekshiruvga yuborish
      type: object
      required: [accept_terms]
      additionalProperties: false
      properties:
        accept_terms: { type: boolean, const: true }

    RegistrationState:
      type: object
      required: [current_step, completed_steps, state]
      properties:
        current_step: { type: integer, minimum: 1, maximum: 4, readOnly: true }
        completed_steps:
          type: array
          readOnly: true
          items: { type: integer, minimum: 1, maximum: 4 }
        state: { allOf: [{ $ref: '#/components/schemas/DriverState' }], readOnly: true }

    DocumentKind:
      type: string
      enum: [license_front, license_back, tech_passport_front, tech_passport_back, passport, selfie, car_photo, avatar]

    UploadUrlRequest:
      type: object
      required: [kind, content_type, size_bytes]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        content_type: { type: string, enum: [image/jpeg, image/png], description: PDF qabul qilinmaydi }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }

    UploadUrl:
      type: object
      required: [document_id, upload_url, method, expires_at]
      properties:
        document_id: { $ref: '#/components/schemas/Uuid' }
        upload_url:
          type: string
          format: uri
          readOnly: true
          description: "`PUT /api/v1/drivers/documents/{id}/content?expires=...&signature=...`"
        method: { type: string, const: PUT, readOnly: true }
        headers:
          type: object
          readOnly: true
          description: "PUT so'roviga qo'yiladigan sarlavhalar (masalan `Content-Type`)"
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time, readOnly: true }

    DriverStatus:
      type: object
      required: [state, updated_at]
      properties:
        state: { allOf: [{ $ref: '#/components/schemas/DriverState' }], readOnly: true }
        reason: { type: [string, 'null'], readOnly: true, description: Rad etish yoki bloklash sababi kaliti }
        updated_at: { type: string, format: date-time, readOnly: true }

    # ----------------------------------------------------------- orders
    OrderType:
      type: string
      enum: [passenger, delivery]

    CarClass:
      type: string
      enum: [economy, comfort, business, minivan]

    PaymentMethod:
      type: string
      enum: [cash, card, wallet, payme, click]

    VehicleType:
      type: string
      enum: [spark, damas, labo, isuzu, isuzu2, fura]
      description: Yuk mashinasi turi (faqat `type = delivery` uchun)

    OrderStatus:
      type: string
      enum: [searching, accepted, arrived, in_progress, completed, cancelled, expired]

    OrderCreate:
      type: object
      required: [type, from, to, payment_method]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/OrderType' }
        seats:
          type: integer
          minimum: 1
          maximum: 4
          description: O'rindiqlar soni (passenger uchun; car_class bilan birga yuborilmaydi)
        car_class:
          allOf: [{ $ref: '#/components/schemas/CarClass' }]
          description: Butun mashina turi (seats o'rniga)
        vehicle_type:
          allOf: [{ $ref: '#/components/schemas/VehicleType' }]
          description: Yetkazib berish (delivery) uchun majburiy; passenger uchun yuborilmaydi
        from: { $ref: '#/components/schemas/GeoPoint' }
        to: { $ref: '#/components/schemas/GeoPoint' }
        scheduled_at:
          type: string
          format: date-time
          description: Bo'sh bo'lsa — hozir
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        comment: { type: string, maxLength: 200 }
      description: |
        Narx, masofa va status YUBORILMAYDI — server hisoblaydi.
        `type = passenger` — `seats` YOKI `car_class` (bittasi). `type = delivery` — faqat `vehicle_type`.
      oneOf:
        - required: [seats]
          not: { anyOf: [{ required: [car_class] }, { required: [vehicle_type] }] }
        - required: [car_class]
          not: { anyOf: [{ required: [seats] }, { required: [vehicle_type] }] }
        - required: [vehicle_type]
          not: { anyOf: [{ required: [seats] }, { required: [car_class] }] }

    OrderUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Faqat shu maydonlarni o'zgartirish so'raladi; server ruxsat beradi yoki rad etadi.
      properties:
        seats: { type: integer, minimum: 1, maximum: 4 }
        car_class: { $ref: '#/components/schemas/CarClass' }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        to: { $ref: '#/components/schemas/GeoPoint' }
        scheduled_at: { type: string, format: date-time }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        comment: { type: string, maxLength: 200 }

    OrderCancel:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, enum: [changed_plans, long_wait, driver_asked, wrong_address, other] }
        comment: { type: string, maxLength: 200 }

    Order:
      type: object
      required: [id, type, from, to, payment_method, status, price, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/OrderType' }
        seats: { type: integer }
        car_class: { $ref: '#/components/schemas/CarClass' }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        from: { $ref: '#/components/schemas/GeoPoint' }
        to: { $ref: '#/components/schemas/GeoPoint' }
        scheduled_at: { type: [string, 'null'], format: date-time }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        comment: { type: [string, 'null'] }
        status: { allOf: [{ $ref: '#/components/schemas/OrderStatus' }], readOnly: true }
        price: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
        distance_m: { type: integer, readOnly: true }
        duration_s: { type: integer, readOnly: true, description: Taxminiy davomiylik }
        driver:
          readOnly: true
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                first_name: { type: string }
                rating: { type: number }
                car: { $ref: '#/components/schemas/Car' }
        trip_id: { type: [string, 'null'], format: uuid, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    OrderPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Order' } }

    # ------------------------------------------------------------ trips
    Offer:
      type: object
      required: [id, order_id, type, from, to, price, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order_id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/OrderType' }
        seats: { type: integer, readOnly: true }
        car_class: { $ref: '#/components/schemas/CarClass' }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        from: { $ref: '#/components/schemas/GeoPoint' }
        to: { $ref: '#/components/schemas/GeoPoint' }
        price: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
        commission: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
        distance_m: { type: integer, readOnly: true }
        pickup_eta_s: { type: integer, readOnly: true }
        expires_at: { type: string, format: date-time, readOnly: true }

    OfferPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Offer' } }

    Trip:
      type: object
      required: [id, order_id, driver_id, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order_id: { $ref: '#/components/schemas/Uuid' }
        driver_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [assigned, in_progress, completed, cancelled], readOnly: true }
        started_at: { type: [string, 'null'], format: date-time, readOnly: true }
        completed_at: { type: [string, 'null'], format: date-time, readOnly: true }
        final_price: { type: [integer, 'null'], readOnly: true, description: Tiyinda }
        commission: { type: [integer, 'null'], readOnly: true, description: Tiyinda }
        distance_m: { type: [integer, 'null'], readOnly: true }

    # ----------------------------------------------------------- wallet
    WalletBalance:
      type: object
      required: [wallet_id, balance, debt, debt_limit, limit_reached, currency]
      properties:
        wallet_id: { $ref: '#/components/schemas/Uuid' }
        balance: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true, description: Manfiy bo'lishi mumkin }
        debt: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
        debt_limit: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
        limit_reached: { type: boolean, readOnly: true }
        debt_status: { type: string, enum: [ok, approaching, at_limit], readOnly: true, description: "ok | approaching (limitning 80% i) | at_limit (yangi buyurtma olinmaydi)" }
        currency: { type: string, const: UZS, readOnly: true }

    LedgerEntry:
      type: object
      required: [id, wallet_id, kind, amount, balance_after, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        wallet_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [trip_payment, commission, topup, correction, bonus], readOnly: true }
        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true, description: 'Ishorali (+ kirim, − chiqim)' }
        balance_after: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
        reference_id: { type: [string, 'null'], format: uuid, readOnly: true, description: trip / payment / correction ID }
        created_at: { type: string, format: date-time, readOnly: true }

    LedgerPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }

    TopupRequest:
      type: object
      required: [amount, provider]
      additionalProperties: false
      properties:
        amount: { type: integer, minimum: 100000, maximum: 1000000000, description: "To'ldiriladigan summa, tiyinda" }
        provider: { type: string, enum: [payme, click] }

    TopupSession:
      type: object
      required: [payment_id, status, redirect_url]
      properties:
        payment_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [pending, paid, failed], readOnly: true }
        redirect_url: { type: string, format: uri, readOnly: true, description: Provayder to'lov sahifasi (hozir mock) }
        expires_at: { type: string, format: date-time, readOnly: true }

    CardLinkRequest:
      type: object
      required: [provider]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [payme, click] }

    CardLinkSession:
      type: object
      required: [link_id, redirect_url, expires_at]
      properties:
        link_id: { $ref: '#/components/schemas/Uuid' }
        redirect_url: { type: string, format: uri, readOnly: true, description: Provayder karta ulash sahifasi (hozir mock) }
        expires_at: { type: string, format: date-time, readOnly: true }

    # ---------------------------------------------------------- ratings
    RatingInput:
      type: object
      required: [stars]
      additionalProperties: false
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        reason:
          type: object
          required: [kind]
          additionalProperties: false
          description: Faqat stars = 5 bo'lganda yuboriladi
          properties:
            kind: { type: string, enum: [polite, good_talk, comfort, just_because, custom] }
            custom_text: { type: string, minLength: 1, maxLength: 200 }
          if:
            properties: { kind: { const: custom } }
          then:
            required: [custom_text]
          else:
            not: { required: [custom_text] }
      if:
        properties: { stars: { const: 5 } }
      then:
        required: [reason]
      else:
        not: { required: [reason] }

    Rating:
      type: object
      required: [order_id, stars, created_at]
      properties:
        order_id: { $ref: '#/components/schemas/Uuid' }
        stars: { type: integer, minimum: 1, maximum: 5 }
        reason:
          type: [object, 'null']
          properties:
            kind: { type: string, enum: [polite, good_talk, comfort, just_because, custom] }
            custom_text: { type: [string, 'null'], maxLength: 200 }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: [string, 'null'], format: date-time, readOnly: true }

    # ---------------------------------------------------- notifications
    Notification:
      type: object
      required: [id, kind, title_key, params, read, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [order, trip, wallet, driver, system, promo], readOnly: true }
        title_key: { type: string, readOnly: true, description: Lokalizatsiya kaliti }
        body_key: { type: string, readOnly: true }
        params: { type: object, additionalProperties: true, readOnly: true }
        read: { type: boolean, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Notification' } }

    # ---------------------------------------------------------- profile
    Profile:
      type: object
      required: [id, phone, role, settings]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        phone: { allOf: [{ $ref: '#/components/schemas/Phone' }], readOnly: true }
        first_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        role: { type: string, enum: [passenger, driver], readOnly: true }
        rating: { type: [number, 'null'], readOnly: true }
        settings: { $ref: '#/components/schemas/Settings' }
        created_at: { type: string, format: date-time, readOnly: true }

    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        first_name: { type: string, minLength: 1, maxLength: 50 }
        last_name: { type: string, minLength: 1, maxLength: 50 }

    Settings:
      type: object
      additionalProperties: false
      properties:
        language: { type: string, enum: [uz, ru, en] }
        theme: { type: string, enum: [light, dark, system] }
        notifications:
          type: object
          additionalProperties: false
          properties:
            push: { type: boolean }
            sms: { type: boolean }
            promo: { type: boolean }

    # ------------------------------------------------------------ admin
    StaffRole:
      type: string
      enum: [superadmin, owner, manager, marketer, operator]

    AdminSection:
      type: string
      enum: [staff, drivers, passengers, orders, wallet, tariffs, operator, stats]

    AdminMe:
      type: object
      required: [id, email, role, sections, creatable_roles]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, readOnly: true }
        full_name: { type: string, readOnly: true }
        role: { allOf: [{ $ref: '#/components/schemas/StaffRole' }], readOnly: true }
        sections:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/AdminSection' }
        creatable_roles:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/StaffRole' }

    Staff:
      type: object
      required: [id, email, phone, full_name, role, state, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: [string, 'null'], format: email, description: "`null` — email'siz operator" }
        phone: { $ref: '#/components/schemas/Phone' }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        state: { type: string, enum: [active, blocked, archived], readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    StaffCreate:
      type: object
      required: [phone, full_name, role]
      additionalProperties: false
      description: |
        `email` majburiy emas: email'siz (yoki `null`) faqat `operator` yaratiladi — u admin panelga
        telefon + SMS bilan kiradi (email qadamisiz). Boshqa rollar uchun email shart
        (aks holda `422 VALIDATION_ERROR`, `fields.email: required`).
      properties:
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { $ref: '#/components/schemas/Phone' }
        full_name: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: '#/components/schemas/StaffRole' }
      if:
        not:
          properties: { role: { const: operator } }
      then:
        required: [email]
        properties:
          email: { type: string }

    StaffUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        full_name: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: '#/components/schemas/StaffRole' }
        state: { type: string, enum: [active, blocked] }

    StaffPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Staff' } }

    AccountState:
      type: string
      enum: [active, blocked, archived]

    AdminPersonCreate:
      type: object
      required: [phone, first_name, last_name]
      additionalProperties: false
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        first_name: { type: string, minLength: 1, maxLength: 50 }
        last_name: { type: string, minLength: 1, maxLength: 50 }

    AdminPersonUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "`state: blocked` — bloklash (sabab majburiy), `state: archived` — arxivlash."
      properties:
        first_name: { type: string, minLength: 1, maxLength: 50 }
        last_name: { type: string, minLength: 1, maxLength: 50 }
        state: { $ref: '#/components/schemas/AccountState' }
        state_reason: { type: string, maxLength: 200 }
      if:
        properties: { state: { const: blocked } }
        required: [state]
      then:
        required: [state_reason]

    AdminDriver:
      type: object
      required: [id, phone, first_name, last_name, state, driver_state, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        phone: { $ref: '#/components/schemas/Phone' }
        first_name: { type: string }
        last_name: { type: string }
        state: { allOf: [{ $ref: '#/components/schemas/AccountState' }], readOnly: true }
        state_reason: { type: [string, 'null'], readOnly: true }
        driver_state: { allOf: [{ $ref: '#/components/schemas/DriverState' }], readOnly: true }
        car: { allOf: [{ $ref: '#/components/schemas/Car' }], readOnly: true }
        rating: { type: number, readOnly: true }
        trips_count: { type: integer, readOnly: true }
        wallet_balance: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    AdminDriverPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/AdminDriver' } }

    AdminPassenger:
      type: object
      required: [id, phone, state, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        phone: { $ref: '#/components/schemas/Phone' }
        first_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        state: { allOf: [{ $ref: '#/components/schemas/AccountState' }], readOnly: true }
        state_reason: { type: [string, 'null'], readOnly: true }
        rating: { type: [number, 'null'], readOnly: true }
        orders_count: { type: integer, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    AdminPassengerPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/AdminPassenger' } }

    ApprovalStatus:
      type: string
      enum: [pending_approval, approved, rejected]
      description: Ikki kishi tasdig'i holati. Yaratuvchi va tasdiqlovchi turli xodim bo'lishi shart.

    CorrectionCreate:
      type: object
      required: [wallet_id, amount, reason]
      additionalProperties: false
      properties:
        wallet_id: { type: string, format: uuid }
        amount: { type: integer, not: { const: 0 }, description: 'Ishorali tuzatish summasi, tiyinda' }
        reason: { type: string, minLength: 5, maxLength: 500 }

    Correction:
      type: object
      required: [id, wallet_id, amount, reason, approval_status, created_by, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        wallet_id: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string }
        approval_status: { allOf: [{ $ref: '#/components/schemas/ApprovalStatus' }], readOnly: true }
        created_by: { $ref: '#/components/schemas/Uuid' }
        approved_by: { type: [string, 'null'], format: uuid, readOnly: true, description: Tasdiqlagan yoki rad etgan xodim }
        reject_reason: { type: [string, 'null'], readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    TariffFields:
      type: object
      description: Tarif maydonlari (TariffInput va Tariff uchun umumiy baza)
      required: [name, car_class, base_fare, per_km, per_min, min_fare, commission_percent]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        car_class: { $ref: '#/components/schemas/CarClass' }
        base_fare: { type: integer, minimum: 0, description: Tiyinda }
        per_km: { type: integer, minimum: 0, description: Tiyinda }
        per_min: { type: integer, minimum: 0, description: Tiyinda }
        min_fare: { type: integer, minimum: 0, description: Tiyinda }
        commission_percent: { type: number, minimum: 0, maximum: 100 }

    TariffInput:
      allOf:
        - $ref: '#/components/schemas/TariffFields'
      unevaluatedProperties: false

    Tariff:
      allOf:
        - $ref: '#/components/schemas/TariffFields'
        - type: object
          required: [id, active, approval_status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            active: { type: boolean, readOnly: true }
            approval_status: { allOf: [{ $ref: '#/components/schemas/ApprovalStatus' }], readOnly: true }
            pending_change:
              readOnly: true
              description: Tasdiq kutayotgan o'zgarish (yaratish/o'zgartirish/o'chirish)
              oneOf:
                - type: 'null'
                - type: object
                  properties:
                    action: { type: string, enum: [create, update, delete] }
                    requested_by: { type: string, format: uuid }
                    requested_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time, readOnly: true }

    TariffPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Tariff' } }

    QueueItem:
      type: object
      required: [id, kind, subject_id, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [driver_application, document_update, complaint], readOnly: true }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [waiting, in_progress, completed, rejected], readOnly: true }
        assigned_to: { type: [string, 'null'], format: uuid, readOnly: true }
        result:
          type: [string, 'null']
          enum: [resolved, unresolved, null]
          readOnly: true
          description: Faqat status = completed bo'lganda to'ldiriladi
        comment: { type: [string, 'null'], readOnly: true, description: Operator izohi (complete paytida) }
        reject_reason: { type: [string, 'null'], readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        finished_at: { type: [string, 'null'], format: date-time, readOnly: true }

    QueueReject:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    QueueComplete:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: { type: string, enum: [resolved, unresolved] }
        comment: { type: string, maxLength: 1000 }

    ApprovalReject:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    QueuePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/QueueItem' } }

    Stats:
      type: object
      readOnly: true
      required: [orders_total, orders_completed, orders_cancelled, active_drivers, online_drivers, new_passengers, revenue, commission]
      properties:
        orders_total: { type: integer }
        orders_completed: { type: integer }
        orders_cancelled: { type: integer }
        active_drivers: { type: integer }
        online_drivers: { type: integer }
        new_passengers: { type: integer }
        revenue: { $ref: '#/components/schemas/Money' }
        commission: { $ref: '#/components/schemas/Money' }
        drivers_over_limit: { type: integer, description: Qarz limitiga yetgan haydovchilar }
